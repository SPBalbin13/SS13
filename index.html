<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escáner QR — Control de Recreos</title>
<style>
  :root{--bg:#0b1120;--panel:#111827;--line:#1f2937;--primary:#1995AD;--ice:#A1D6E2;--text:#f1f1f2;--muted:#9aa4b2;--danger:#ef4444;--success:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;align-items:center;justify-content:center;padding:18px}
  .card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.4)}
  .head{padding:18px 20px;border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:17px}
  .head p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .viewport{position:relative;background:#000;aspect-ratio:1/1}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:12%;border:3px solid var(--ice);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
  .frame.ok{border-color:var(--success)}
  .body{padding:18px 20px}
  #status{margin:0 0 14px;font-size:14px;color:var(--muted);min-height:20px}
  #status.err{color:var(--danger)}
  #status.ok{color:var(--success)}
  button{width:100%;padding:13px;border-radius:11px;border:0;font-weight:700;font-size:14px;cursor:pointer;background:var(--primary);color:#fff}
  button.secondary{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:10px}
  .hidden{display:none!important}
  .spin{width:26px;height:26px;border:3px solid #ffffff33;border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>📷 Escáner de zona</h1>
      <p>Apunta la cámara al código QR pegado en la zona del recreo.</p>
    </div>
    <div class="viewport">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame" id="frame"></div>
    </div>
    <div class="body">
      <p id="status">Solicitando acceso a la cámara…</p>
      <button id="btnRetry" class="secondary hidden" onclick="iniciarCamara()">↻ Reintentar</button>
      <button id="btnManual" class="secondary hidden" onclick="escaneoManual()">⌨ Ingresar código manualmente</button>
    </div>
  </div>

<canvas id="canvas" class="hidden"></canvas>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// ============================================================
// Parámetros que llegan desde la app de Apps Script:
//   ?return=<URL /exec de la Web App>   (a dónde volver)
//   ?token=<token firmado del docente>  (identidad; solo se reenvía tal cual)
// ============================================================
const params = new URLSearchParams(location.search);
const RETURN_URL = params.get('return') || '';
const TOKEN = params.get('token') || '';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const frameEl = document.getElementById('frame');
const btnRetry = document.getElementById('btnRetry');
const btnManual = document.getElementById('btnManual');

let stream = null;
let detenido = false; // evita procesar más de un QR / redirigir dos veces
let rafId = null;

function setStatus(msg, tipo){
  statusEl.textContent = msg;
  statusEl.className = tipo || '';
}

function validarParametros(){
  if(!RETURN_URL){
    setStatus('Falta el parámetro "return" en el enlace. Abre la cámara desde la app de Control de Recreos, no directamente esta página.', 'err');
    btnRetry.classList.add('hidden');
    btnManual.classList.add('hidden');
    return false;
  }
  return true;
}

async function iniciarCamara(){
  if(!validarParametros()) return;
  detenido = false;
  btnRetry.classList.add('hidden');
  frameEl.classList.remove('ok');
  setStatus('Solicitando acceso a la cámara…');
  try{
    // Cámara trasera si el dispositivo la tiene (celulares); facingMode es solo
    // una preferencia, así que en laptops cae de vuelta a la webcam normal.
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Enfoca el código QR de la zona…');
    btnManual.classList.remove('hidden');
    rafId = requestAnimationFrame(tick);
  }catch(err){
    console.error(err);
    let msg = 'No se pudo acceder a la cámara.';
    if(err.name === 'NotAllowedError') msg = 'Permiso de cámara denegado. Autorízalo en el navegador e inténtalo de nuevo.';
    else if(err.name === 'NotFoundError') msg = 'No se encontró ninguna cámara en este dispositivo.';
    else if(location.protocol !== 'https:') msg = 'Esta página debe abrirse por HTTPS para usar la cámara.';
    setStatus(msg, 'err');
    btnRetry.classList.remove('hidden');
    btnManual.classList.remove('hidden');
  }
}

function tick(){
  if(detenido) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if(code && code.data){
      onDetectado(code.data);
      return;
    }
  }
  rafId = requestAnimationFrame(tick);
}

function onDetectado(valor){
  if(detenido) return;
  detenido = true;
  frameEl.classList.add('ok');
  setStatus('✓ Código leído. Enviando…', 'ok');
  detenerCamara();
  redirigir(valor);
}

function detenerCamara(){
  if(rafId) cancelAnimationFrame(rafId);
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function redirigir(valorEscaneado){
  const sep = RETURN_URL.includes('?') ? '&' : '?';
  const url = `${RETURN_URL}${sep}scanned=${encodeURIComponent(valorEscaneado)}&token=${encodeURIComponent(TOKEN)}`;
  location.href = url;
}

function escaneoManual(){
  if(!validarParametros()) return;
  const codigo = prompt('Ingresa el código de la zona (por ejemplo: Z01):');
  if(codigo && codigo.trim()){
    detenerCamara();
    redirigir(codigo.trim());
  }
}

window.addEventListener('pagehide', detenerCamara);
iniciarCamara();
</script>
</body>
</html>
