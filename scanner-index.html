<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escanear zona · Control de Recreos</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --bg:#020617;--panel:#0f172a;--line:#ffffff14;--text:#fff;--muted:#94a3b8;
    --primary:#4f46e5;--primary2:#7c3aed;--danger:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  button{cursor:pointer;border:0;font:inherit}
  .head{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:17px}.head small{display:block;color:var(--muted);margin-top:3px;font-weight:400}
  .btn{padding:10px 15px;border-radius:10px;font-weight:700;background:#fff;color:#101828}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px #4f46e555}
  .btn.danger{background:#fef2f2;color:#b91c1c}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;min-height:60vh}
  video{width:100%;height:100%;object-fit:cover}
  canvas{display:none}
  .overlay{position:absolute;width:min(72vw,320px);height:min(72vw,320px);border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
  .corners{position:absolute;width:min(72vw,320px);height:min(72vw,320px);border-radius:22px;pointer-events:none}
  .corners:before,.corners:after{content:"";position:absolute;inset:0;border-radius:22px;border:4px solid transparent}
  .corners:before{border-top-color:#8b5cf6;border-left-color:#8b5cf6}
  .corners:after{border-right-color:#22c55e;border-bottom-color:#22c55e}
  .status{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#111827dd;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-size:12px;z-index:2;text-align:center;max-width:88%}
  .hint{position:absolute;bottom:22px;left:16px;right:16px;text-align:center;background:#0f172acc;padding:12px 16px;border-radius:14px;color:#e2e8f0;font-size:13px}
  .foot{padding:14px 18px;background:var(--panel);display:flex;gap:10px;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .foot .btn{min-width:130px}
  .center-msg{margin:auto;padding:32px 24px;max-width:420px;text-align:center}
  .center-msg .icon{font-size:40px;margin-bottom:12px}
  .center-msg h2{margin:0 0 8px;font-size:19px}
  .center-msg p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>

<div class="head">
  <div><h1>Escanear zona</h1><small>Apunta al código QR de tu zona de recreo</small></div>
</div>

<div id="stage" class="stage">
  <div id="status" class="status">Solicitando cámara…</div>
  <video id="video" autoplay playsinline muted></video>
  <div class="overlay"></div>
  <div class="corners"></div>
  <div class="hint">Mantén el QR dentro del recuadro. No cierres esta pestaña.</div>
  <canvas id="canvas"></canvas>
</div>

<div class="foot">
  <button class="btn" id="switchBtn" onclick="switchCamera()">↻ Cambiar cámara</button>
  <button class="btn danger" onclick="cancelar()">Cancelar</button>
</div>

<script>
// ============================================================
// Config: URL de retorno (?return=https://script.google.com/.../exec)
// ============================================================
const params = new URLSearchParams(location.search);
const RETURN_URL = params.get('return') || '';

// Medida de seguridad básica: solo redirigimos de vuelta a dominios de
// Google Apps Script. Si el parámetro "return" viene manipulado o vacío,
// avisamos en vez de redirigir a cualquier sitio (evita open-redirect).
function returnUrlEsValida(url){
  try{
    const u = new URL(url);
    return u.protocol === 'https:' && /(^|\.)script\.google(usercontent)?\.com$/.test(u.hostname);
  }catch(e){ return false; }
}

let stream = null, running = false, raf = 0, detected = false, detector = null, facing = 'environment';

function setStatus(t){ const s=document.getElementById('status'); if(s) s.textContent = t; }

function showBlockingMessage(icon, title, body, showRetry){
  document.getElementById('stage').innerHTML = `
    <div class="center-msg">
      <div class="icon">${icon}</div>
      <h2>${title}</h2>
      <p>${body}</p>
      ${showRetry ? '<button class="btn primary" onclick="location.reload()">Reintentar</button>' : ''}
    </div>`;
  document.getElementById('switchBtn').style.display = 'none';
}

async function start(){
  if(!RETURN_URL || !returnUrlEsValida(RETURN_URL)){
    showBlockingMessage('⚠️', 'Enlace incompleto', 'Esta página debe abrirse desde el botón "Abrir cámara y escanear" de Control de Recreos, no directamente.', false);
    return;
  }
  if(!window.isSecureContext){
    showBlockingMessage('🔒', 'Se requiere HTTPS', 'La cámara solo funciona sobre una conexión segura (https://). Verifica la URL de GitHub Pages.', false);
    return;
  }
  const video = document.getElementById('video');
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Cámara activa · buscando QR…');
    running = true; detected = false;
    if('BarcodeDetector' in window){
      try{ detector = new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector = null; }
    }
    scanFrame();
  }catch(err){
    console.error(err);
    const reason = err && err.name === 'NotAllowedError'
      ? 'Debes permitir el acceso a la cámara para poder escanear tu zona. Revisa los permisos del sitio en tu navegador y vuelve a intentar.'
      : err && err.name === 'NotFoundError'
        ? 'No se encontró una cámara disponible en este dispositivo.'
        : 'No se pudo acceder a la cámara: ' + (err && err.message ? err.message : err);
    showBlockingMessage('📷', 'Cámara no disponible', reason, true);
  }
}

async function scanFrame(){
  if(!running || detected) return;
  const video = document.getElementById('video');
  if(!video || video.readyState < 2){ raf = requestAnimationFrame(scanFrame); return; }
  try{
    if(detector){
      const codes = await detector.detect(video);
      if(codes && codes.length && codes[0].rawValue){ return onDetected(codes[0].rawValue); }
    }
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    const w = video.videoWidth, h = video.videoHeight;
    if(w && h){
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      if(window.jsQR){
        const image = ctx.getImageData(0, 0, w, h);
        const code = window.jsQR(image.data, w, h, {inversionAttempts:'attemptBoth'});
        if(code && code.data) return onDetected(code.data);
      }
    }
  }catch(e){ console.debug('scanFrame', e); }
  raf = requestAnimationFrame(scanFrame);
}

function stopStream(){
  running = false;
  if(raf) cancelAnimationFrame(raf);
  raf = 0;
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function onDetected(rawValue){
  if(detected) return;
  detected = true;
  setStatus('QR detectado · redirigiendo…');
  stopStream();
  const sep = RETURN_URL.indexOf('?') > -1 ? '&' : '?';
  location.href = RETURN_URL + sep + 'scanned=' + encodeURIComponent(rawValue);
}

async function switchCamera(){
  stopStream();
  facing = (facing === 'environment') ? 'user' : 'environment';
  await start();
}

function cancelar(){
  stopStream();
  if(RETURN_URL && returnUrlEsValida(RETURN_URL)){
    location.href = RETURN_URL;
  }else{
    setStatus('Cancelado. Puedes cerrar esta pestaña.');
    showBlockingMessage('✕', 'Escaneo cancelado', 'Puedes cerrar esta pestaña y volver a Control de Recreos.', false);
  }
}

start();
</script>
</body>
</html>
